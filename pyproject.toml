[project]
name = "streams-ai-agent-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "aiomysql>=0.3.2",
    "charset-normalizer>=3.5.1",
    "clean-text>=0.7.1",
    "cryptography>=50.0.1",
    "defusedxml>=0.7.1",
    "docling>=2.126.0",
    "docutils>=0.23",
    "emoji>=2.15.0",
    "fastapi[standard]>=0.141.1",
    "ftfy>=6.3.1",
    "odfdo>=3.25.0",
    "openai>=3.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app"]

[dependency-groups]
dev = [
    "ebooklib>=0.20",
    "odfpy>=1.4.1",
    "psutil>=7.2.2",
]
