[project]
name = "streams-ai-agent-gateway"
version = "0.1.0"
description = "Streams AI Agent Gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "aiomysql>=0.3.2",
    "charset-normalizer>=3.5.1",
    "clean-text>=0.7.1",
    "cryptography>=50.0.1",
    "defusedxml>=0.7.1",
    "docling>=2.126.0",
    "docutils>=0.23",
    "emoji>=2.15.0",
    "fastapi[standard]>=0.141.1",
    "ftfy>=6.3.1",
    "livekit-agents==1.8.4",
    "livekit-plugins-openai==1.8.4",
    "livekit-api==1.2.1",
    "odfdo>=3.25.0",
    "openai>=2.50.0",
    "openpyxl>=3.1.5",
    "opensearch-py[async]>=3.2.0",
    "pandas>=3.0.5",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "redis==8.1.0",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.14.0",
    "tzdata>=2026.3",
    "pyrnnoise>=0.4.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app"]

[dependency-groups]
dev = [
    "ebooklib>=0.20",
    "faker>=40.38.0",
    "odfpy>=1.4.1",
    "psutil>=7.2.2",
    "sentence-transformers>=6.0.1",
]
